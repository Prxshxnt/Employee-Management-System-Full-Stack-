<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - Employee Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2 class="logo">EMS</h2>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="employees.html">Employees</a>
            <a href="employee-form.html">Add Employee</a>
            <a href="departments.html" class="active">Departments</a>
        </nav>
    </aside>

    <main class="content">
        <div class="page-header">
            <h1>Departments</h1>
        </div>

        <div id="message" class="message hidden"></div>

        <section class="card">
            <h2>Add Department</h2>
            <form id="departmentForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="deptName">Name *</label>
                        <input type="text" id="deptName" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="deptDescription">Description</label>
                        <input type="text" id="deptDescription" maxlength="255">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Department</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>All Departments</h2>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Description</th></tr></thead>
                    <tbody id="departmentBody">
                    <tr><td colspan="3" class="empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/departments.js"></script>
</body>
</html>
